services:
  fx90-simulator:
    build: .
    container_name: fx90-simulator
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
      - ./tests:/app/tests
    env_file:
      - .secrets
    environment:
      FX90_HOST: "0.0.0.0"
      FX90_HTTPS_PORT: "443"
      FX90_BIB_START: "1"
      FX90_BIB_END: "429"
      FX90_RUNNER_COUNT: "400"
      FX90_TAG_ORDER: "random"
      FX90_NOISE_PERCENT: "5"
      FX90_MAX_BURST_SIZE: "20"
      FX90_MAX_BURST_SECONDS: "0.8"
      FX90_BETWEEN_BURSTS_MIN: "2"
      FX90_BETWEEN_BURSTS_MAX: "8"
      FX90_REPORT_EACH_TAG_ONCE: "true"
      FX90_NOISE_POOL_SIZE: "50"
      FX90_AUTO_START: "false"
      FX90_HEARTBEAT_SECONDS: "5"
